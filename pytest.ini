[pytest]
# Bare `pytest` at the repo root tried to collect
# evals/fixtures/anti-slop-sequence/*/test_calculator.py as real tests -- these
# are sample-data fixtures consumed by evals/run_evals.py's own file-reading
# logic (they share the filename test_calculator.py across all four snapshot
# directories by design, so the eval can diff the same logical file's evolution;
# renaming them would require restructuring that logic for no real benefit).
# Exclude fixture directories from collection everywhere in the tree.
norecursedirs = .git *fixtures* node_modules .venv venv
