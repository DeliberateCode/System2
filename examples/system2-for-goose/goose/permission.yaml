user:
  Bash:
    permission: ask_before
  Edit:
    permission: ask_before
  Read:
    permission: ask_before
  Write:
    permission: ask_before
  shell:
    permission: ask_before
never_allow_commands:
- chmod -R 777
- "curl | sh"
- dd
- git push --force
- mkfs
- rm -rf /
- rm -rf ~
- shutdown
- sudo rm
- "wget | sh"
