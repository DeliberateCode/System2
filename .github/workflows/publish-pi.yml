name: Publish Pi package

# Manually publish through npm's OIDC trusted publisher with provenance.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and `npm publish --dry-run` (no upload)."
        type: boolean
        default: true

# Grant only checkout access and the OIDC exchange.
permissions:
  contents: read
  id-token: write

jobs:
  publish-pi:
    # The npm-publish environment limits deployments to main.
    environment: npm-publish
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch needs an explicit main-branch guard.
      - name: Refuse dispatch off the main branch
        if: github.ref != 'refs/heads/main'
        # Pass the untrusted ref through env; direct expression interpolation could
        # inject shell syntax before the branch guard runs.
        env:
          DISPATCHED_REF: ${{ github.ref }}
        run: |
          echo "::error::publish-pi.yml must be dispatched on refs/heads/main, not $DISPATCHED_REF. This is the one irreversible step in the release process; dispatching on a feature branch to bypass the merge gate is a plan violation, not a shortcut." >&2
          exit 1

      # Publish the exact dispatched commit, not a later main revision.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.11 (freshness guard)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Refuse stale generated artifacts.
      - name: Freshness gate — committed distributions are in sync with source
        run: python compiler/tools/regen_all.py --check

      # Publish the committed, guard-verified package verbatim. Provenance is
      # attested via OIDC; --access public makes the scoped package public.
      - name: Publish (or dry-run) @deliberatecode/pi-system2
        working-directory: distributions/pi
        run: |
          set -euxo pipefail
          # Pin npm because this job can request an OIDC token.
          npm install -g npm@12.0.2
          npm --version
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
