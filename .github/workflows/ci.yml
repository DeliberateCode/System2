name: CI

# Run core and compiler checks with the real Pi validator.

on: [push, pull_request]

# CI needs read-only repository access.
permissions:
  contents: read

jobs:
  core-evals:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run core evals
        run: python evals/run_evals.py

  compiler-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Pin validators so load checks run instead of skipping.
      - name: Install Pi (validator for the Pi load leg)
        run: npm i -g @earendil-works/pi-coding-agent@0.80.2

      - name: Confirm validators are on PATH (no silent skips)
        working-directory: compiler
        run: |
          set -euxo pipefail
          node --version
          pi --version || (echo "pi not installed — the Pi load leg would LOUD-SKIP" && exit 1)

      # Actions' npm layout is not auto-detected; export the package entry explicitly.
      - name: Export Pi package entry for the load/lifecycle harness
        run: |
          set -euxo pipefail
          entry="$(npm root -g)/@earendil-works/pi-coding-agent/dist/index.js"
          test -f "$entry" || (echo "Pi package entry not found at $entry" && exit 1)
          echo "PI_PKG_ENTRY=$entry" >> "$GITHUB_ENV"

      # A skipped eval indicates a missing validator and fails CI.
      - name: Run eval suite (skip count MUST be 0)
        working-directory: compiler
        run: |
          python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("evals", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print(f"\nFAIL: {len(result.skipped)} test(s) SKIPPED (a missing "
                    "validator must not silently pass):", file=sys.stderr)
              for test, reason in result.skipped:
                  print(f"  SKIPPED {test}: {reason}", file=sys.stderr)
          ok = result.wasSuccessful() and not result.skipped
          sys.exit(0 if ok else 1)
          PY

      - name: Golden driver — compiler (in-process compose -> emit)
        working-directory: compiler
        run: python -m evals.run_goldens --driver compiler

      - name: Golden driver — oracle (frozen subprocess cross-check)
        working-directory: compiler
        run: python -m evals.run_goldens --driver oracle

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Regenerate and compare all committed artifacts.
      - name: Freshness gate — all three artifacts (bundle + codex + pi)
        run: python compiler/tools/regen_all.py --check

      - name: Grep oracle — no old-repo references outside the historical allowlist
        run: python compiler/tools/check_no_old_repo_refs.py

      # The checksum-verified CLI avoids the action wrapper's organization license.
      - name: Secret scan (gitleaks CLI — pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "${tmp}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tmp}/${tarball}" | sha256sum -c -
          tar -xzf "${tmp}/${tarball}" -C "${tmp}" gitleaks
          "${tmp}/gitleaks" version
          # Scan the working tree and redact matched values from logs.
          "${tmp}/gitleaks" dir . --no-banner --redact --exit-code 1

  # Core subprocess tests use the default bundle; this job covers the pre-flip escape hatch.
  plugin-on-preflip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Plugin's own suite on the frozen preflip escape hatch
        env:
          SYSTEM2_USE_BUNDLE: "0"
        run: python evals/run_evals.py
