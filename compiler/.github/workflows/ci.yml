name: CI

# Portable, CI-runnable gate for the System2 compiler. The eval harness resolves the
# sibling System2 plugin via SYSTEM2_PLUGIN_ROOT (default: <compiler>/../System2/plugin),
# so checking both repos out as siblings is the only layout requirement. Installing the
# real validators (Pi, Goose) promotes the LOUD-SKIP load/block legs to PASS-REQUIRED.

on:
  push:
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      # Both repos are checked out as siblings under the workspace so the harness's
      # default resolution (<compiler>/../System2/plugin) finds the plugin with no env.
      - name: Check out System2-Compiler
        uses: actions/checkout@v4
        with:
          path: System2-Compiler

      - name: Check out System2 (sibling plugin repo)
        uses: actions/checkout@v4
        with:
          repository: DeliberateCode/System2
          path: System2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --- Validators: installing these flips the LOUD-SKIP legs to PASS-REQUIRED ---
      # Pi: the Pi load-validity leg discovers the package via `npm root -g`
      # (test_pi_goldens._resolve_pi_pkg_entry), so a global install is all it needs.
      - name: Install Pi (validator for the Pi load leg)
        run: npm i -g @earendil-works/pi-coding-agent

      # Goose: the Goose descriptor/block legs require the `goose` binary on PATH.
      - name: Install Goose (validator for the Goose legs)
        run: |
          # adjust if the goose install URL changes
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Confirm validators are on PATH (no silent skips)
        working-directory: System2-Compiler
        run: |
          set -euxo pipefail
          node --version
          pi --version || (echo "pi not installed — the Pi load leg would LOUD-SKIP" && exit 1)
          goose --version || (echo "goose not installed — the Goose legs would LOUD-SKIP" && exit 1)

      # The Pi load/lifecycle harness resolves the package entry (dist/index.js) via
      # _resolve_pi_pkg_entry, whose path probes are derived from the `pi` bin location
      # and a ~/.npm-global fallback — neither matches Actions' global install layout, so
      # the entry goes unfound and PiLifecycle.test_doctor_current_validator_ran hard-SKIPs
      # (tripping the skip-count-0 gate). Pin the supported PI_PKG_ENTRY override to the
      # canonical `npm root -g` location so the validator RUNS rather than skips. Fail
      # loudly if it is absent — never let a missing entry become a silent skip.
      - name: Export Pi package entry for the load/lifecycle harness
        run: |
          set -euxo pipefail
          entry="$(npm root -g)/@earendil-works/pi-coding-agent/dist/index.js"
          test -f "$entry" || (echo "Pi package entry not found at $entry" && exit 1)
          echo "PI_PKG_ENTRY=$entry" >> "$GITHUB_ENV"

      # --- Eval suite (fails the job on any test failure) ---
      # The skip-guard wrapper runs unittest discovery in-process and FAILS if ANY test
      # was skipped, so a missing validator (which turns a PASS-required leg into a
      # SkipTest) can never silently pass. Skips are only legitimate when a validator is
      # absent — and on CI the step above guarantees they are present.
      - name: Run eval suite (skip count MUST be 0)
        working-directory: System2-Compiler
        run: |
          python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("evals", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print(f"\nFAIL: {len(result.skipped)} test(s) SKIPPED (a missing "
                    "validator must not silently pass):", file=sys.stderr)
              for test, reason in result.skipped:
                  print(f"  SKIPPED {test}: {reason}", file=sys.stderr)
          ok = result.wasSuccessful() and not result.skipped
          sys.exit(0 if ok else 1)
          PY

      - name: Golden driver — compiler (in-process compose -> emit, DoD-1)
        working-directory: System2-Compiler
        run: python -m evals.run_goldens --driver compiler

      - name: Golden driver — oracle (frozen subprocess cross-check)
        working-directory: System2-Compiler
        run: python -m evals.run_goldens --driver oracle

      - name: Bundle staleness gate (a stale/hand-edited bundle cannot merge)
        working-directory: System2-Compiler
        run: >
          python tools/check_bundle_fresh.py
          --target ../System2/plugin/scripts/_system2_compiler
          --compiler-root .

      - name: Plugin's own suite on the vendored bundle (flip leg)
        working-directory: System2
        env:
          SYSTEM2_USE_BUNDLE: "1"
        run: python evals/run_evals.py
