[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system2-compiler"
version = "0.1.0"
description = "Harness-neutral compiler for System2 overlay composition (IR + pluggable backends), targeting Claude Code, Goose, and Pi."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "James Nordlund", email = "james.nordlund@gmail.com" },
]
keywords = ["system2", "compiler", "overlays", "claude-code", "goose", "pi", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DeliberateCode/System2-Compiler"
Repository = "https://github.com/DeliberateCode/System2-Compiler"
Changelog = "https://github.com/DeliberateCode/System2-Compiler/blob/main/CHANGELOG.md"

[project.scripts]
system2 = "system2_compiler.cli:main"

[tool.setuptools]
packages = [
    "system2_compiler",
    "system2_compiler.ir",
    "system2_compiler.backends",
    "system2_compiler.backends.capabilities",
]

[tool.setuptools.package-data]
"system2_compiler.backends.capabilities" = ["*.json"]
